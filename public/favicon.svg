<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jixuNeonFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="30" fill="#141524" />

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="35" fill="url(#jixuNeonFavicon)" opacity="0.25" />

  <!-- Outer Dashed Ring -->
  <circle
    cx="60"
    cy="60"
    r="38"
    fill="none"
    stroke="url(#jixuNeonFavicon)"
    stroke-width="4.5"
    stroke-dasharray="18 10 30 10"
  />

  <!-- Inner Static Ring -->
  <circle
    cx="60"
    cy="60"
    r="28"
    fill="none"
    stroke="#7928CA"
    stroke-width="2.5"
    opacity="0.65"
  />

  <!-- Pulsing Play Prism -->
  <polygon
    points="50,38 50,82 84,60"
    fill="url(#jixuNeonFavicon)"
  />
</svg>
